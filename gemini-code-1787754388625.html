<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Classi & Schede Alunni</title>
  <style>
    :root {
      --primary: #1e293b;
      --accent: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-light: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { display: flex; height: 100vh; background-color: var(--bg); color: var(--text); }

    /* Sidebar Classi */
    sidebar { width: 260px; background: var(--primary); color: white; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    sidebar h2 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #334155; }
    .class-btn { background: #334155; color: white; border: none; padding: 12px 16px; border-radius: 8px; text-align: left; cursor: pointer; font-weight: 600; font-size: 0.95rem; transition: all 0.2s; }
    .class-btn:hover, .class-btn.active { background: var(--accent); }

    /* Main Area */
    main { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 20px; border-radius: 10px; border: 1px solid var(--border); }
    .header h1 { font-size: 1.5rem; color: var(--primary); }

    /* Grid Layout */
    .dashboard-grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; flex: 1; }

    /* Panel Studenti */
    .panel { background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .panel-title { font-size: 1.1rem; font-weight: 700; color: var(--primary); }

    .student-list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .student-card { padding: 12px 15px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; }
    .student-card:hover, .student-card.active { border-color: var(--accent); background: #eff6ff; }
    .student-card strong { font-size: 0.95rem; }

    /* Details Panel */
    .student-detail { display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
    
    .info-card { background: #f1f5f9; padding: 15px; border-radius: 8px; font-size: 0.9rem; border-left: 4px solid var(--accent); }
    
    /* Box Sommario */
    .ai-summary-box { background: #f0fdf4; border: 1px solid #bbf7d0; border-left: 5px solid #22c55e; padding: 18px; border-radius: 8px; }
    .ai-summary-box h4 { color: #15803d; margin-bottom: 8px; font-size: 1rem; display: flex; align-items: center; gap: 6px; }
    .ai-summary-box textarea { width: 100%; border: 1px solid #cbd5e1; border-radius: 6px; padding: 10px; font-size: 0.9rem; margin-top: 8px; resize: vertical; min-height: 90px; }

    /* Timeline Documenti */
    .doc-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    .doc-item { background: var(--bg); border: 1px solid var(--border); padding: 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    .doc-tag { font-size: 0.75rem; padding: 3px 8px; border-radius: 4px; font-weight: 600; text-transform: uppercase; }
    .tag-verbale { background: #dbeafe; color: #1e40af; }
    .tag-scheda { background: #fef3c7; color: #92400e; }
    .tag-colloquio { background: #fce7f3; color: #9d174d; }

    .btn-download { display: inline-flex; align-items: center; gap: 5px; background: #2563eb; color: white; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 0.8rem; font-weight: 600; }
    .btn-download:hover { background: #1d4ed8; }

    /* Form Aggiunta */
    .add-form { display: flex; flex-direction: column; gap: 10px; background: var(--bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-top: 10px; }
    .form-group { display: flex; gap: 10px; }
    input, select, button { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }
    input, select { flex: 1; }
    .btn { background: var(--accent); color: white; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn:hover { opacity: 0.9; }

    .file-input-wrapper { display: flex; flex-direction: column; gap: 4px; }
    .file-input-wrapper label { font-size: 0.8rem; font-weight: 600; color: var(--text-light); }

    .empty-state { text-align: center; color: var(--text-light); margin: auto; font-style: italic; }
  </style>
</head>
<body>

  <sidebar>
    <h2>Classi</h2>
    <button class="class-btn active" onclick="selectClass('1A')">Classe 1ª A</button>
    <button class="class-btn" onclick="selectClass('2A')">Classe 2ª A</button>
    <button class="class-btn" onclick="selectClass('3A')">Classe 3ª A</button>
    <button class="class-btn" onclick="selectClass('4A')">Classe 4ª A</button>
    <button class="class-btn" onclick="selectClass('5A')">Classe 5ª A</button>
  </sidebar>

  <main>
    <div class="header">
      <div>
        <h1 id="class-title">Classe 1ª A</h1>
        <p style="color: var(--text-light); font-size: 0.9rem;">Registro e fascicolo personale degli alunni</p>
      </div>
      <button class="btn" onclick="addStudentPrompt()">+ Aggiungi Alunno</button>
    </div>

    <div class="dashboard-grid">
      <!-- Elenco Studenti -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Elenco Alunni</span>
          <span id="student-count" style="font-size: 0.85rem; color: var(--text-light);">0 alunni</span>
        </div>
        <div class="student-list" id="student-list"></div>
      </div>

      <!-- Dettaglio Studente -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Scheda Personale Alunno</span>
        </div>
        <div id="student-detail-container" class="student-detail">
          <div class="empty-state">Seleziona un alunno dalla lista per visualizzarne o aggiornarne la scheda.</div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const defaultData = {
      '1A': [
        {
          id: '1',
          nome: 'Mario Rossi',
          note: 'Nato il 12/03/2018. Riferimento famiglia: Madre (Tel. 333-123456).',
          sommario: 'Alunno partecipativo e socievole. Dai verbali dei colloqui emerge un buon livello nella lettura, con necessità di esercizi guidati nell’area della logica matematica.',
          documenti: [
            { tipo: 'colloquio', data: '2026-01-15', titolo: 'Colloquio Primo Quadrimestre', note: 'La famiglia conferma impegno a casa nei compiti di lettura.', fileName: '', fileData: '' },
            { tipo: 'scheda', data: '2026-02-10', titolo: 'Scheda di Valutazione Intermedia', note: 'Ottimi progressi nelle attività espressive.', fileName: '', fileData: '' }
          ]
        }
      ],
      '2A': [], '3A': [], '4A': [], '5A': []
    };

    let currentClass = '1A';
    let currentStudentId = null;

    function getStorage() {
      const data = localStorage.getItem('registro_scuola_db');
      return data ? JSON.parse(data) : defaultData;
    }

    function saveStorage(data) {
      try {
        localStorage.setItem('registro_scuola_db', JSON.stringify(data));
      } catch (e) {
        alert("La memoria del browser è piena! Se stavi caricando un file molto grande (es. PDF pesante), riduci le sue dimensioni.");
      }
    }

    function selectClass(className) {
      currentClass = className;
      currentStudentId = null;

      document.querySelectorAll('.class-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.includes(className.replace('A', 'ª A')));
      });

      document.getElementById('class-title').innerText = `Classe ${className.replace('A', 'ª A')}`;
      renderStudentList();
      renderStudentDetail();
    }

    function renderStudentList() {
      const db = getStorage();
      const students = db[currentClass] || [];
      const listContainer = document.getElementById('student-list');
      document.getElementById('student-count').innerText = `${students.length} alunni`;

      listContainer.innerHTML = '';
      students.forEach(student => {
        const card = document.createElement('div');
        card.className = `student-card ${student.id === currentStudentId ? 'active' : ''}`;
        card.onclick = () => { currentStudentId = student.id; renderStudentList(); renderStudentDetail(); };
        card.innerHTML = `
          <strong>${student.nome}</strong>
          <small style="color: var(--text-light);">${student.documenti.length} doc</small>
        `;
        listContainer.appendChild(card);
      });
    }

    function renderStudentDetail() {
      const container = document.getElementById('student-detail-container');
      if (!currentStudentId) {
        container.innerHTML = `<div class="empty-state">Seleziona un alunno dalla lista per visualizzarne o aggiornarne la scheda.</div>`;
        return;
      }

      const db = getStorage();
      const student = db[currentClass].find(s => s.id === currentStudentId);

      if (!student) return;

      const docsHTML = student.documenti.map(d => `
        <div class="doc-item">
          <div>
            <span class="doc-tag tag-${d.tipo}">${d.tipo}</span>
            <strong style="margin-left: 8px;">${d.titolo}</strong>
            <p style="font-size: 0.85rem; color: var(--text-light); margin-top: 4px;">${d.note}</p>
          </div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px;">
            <small style="color: var(--text-light); white-space: nowrap;">${d.data}</small>
            ${d.fileData ? `<a href="${d.fileData}" download="${d.fileName}" class="btn-download">📄 Apri ${d.fileName}</a>` : ''}
          </div>
        </div>
      `).join('');

      container.innerHTML = `
        <div class="info-card">
          <strong style="font-size: 1.1rem; color: var(--primary); display: block; margin-bottom: 4px;">${student.nome}</strong>
          <span>${student.note || 'Nessuna nota anagrafica inserita.'}</span>
        </div>

        <div class="ai-summary-box">
          <h4>📝 Scheda di Sintesi e Sommario Alunno</h4>
          <p style="font-size: 0.85rem; color: #166534; margin-bottom: 6px;">
            Quadro sintetico basato su schede e verbali. Si aggiorna automaticamente con ogni nuovo documento inserito e puoi modificarlo liberamente:
          </p>
          <textarea id="summary-text" onblur="updateSummary()">${student.sommario}</textarea>
        </div>

        <div>
          <h3 style="font-size: 1rem; color: var(--primary); margin-bottom: 10px;">Fascicolo Documenti, Verbali e Colloqui</h3>
          <div class="doc-list">
            ${docsHTML.length ? docsHTML : '<p style="color: var(--text-light); font-size: 0.9rem;">Nessun documento o verbale registrato.</p>'}
          </div>
        </div>

        <div class="add-form">
          <strong style="font-size: 0.9rem;">+ Carica Nuovo Documento / Verbale / Scheda</strong>
          <div class="form-group">
            <input type="text" id="doc-title" placeholder="Titolo (es. Verbale Colloquio Maggio)">
            <select id="doc-type">
              <option value="verbale">Verbale</option>
              <option value="scheda">Scheda Valutativa</option>
              <option value="colloquio">Colloquio</option>
            </select>
          </div>
          <input type="text" id="doc-notes" placeholder="Sintesi del contenuto o esito della scheda">
          
          <div class="file-input-wrapper">
            <label for="doc-file">Seleziona il file allegato (PDF, Immagine, Word, ecc.):</label>
            <input type="file" id="doc-file" accept="application/pdf,image/*,.doc,.docx,.txt">
          </div>

          <button class="btn" onclick="addDocument()">Registra, Carica File e Aggiorna Sommario</button>
        </div>
      `;
    }

    function addStudentPrompt() {
      const nome = prompt("Nome e Cognome dell'alunno:");
      if (!nome) return;
      const note = prompt("Informazioni / Anagrafica dell'alunno (opzionale):") || '';

      const db = getStorage();
      const newStudent = {
        id: Date.now().toString(),
        nome: nome,
        note: note,
        sommario: "Nessun sommario generato. Registra il primo documento per comporre il quadro dell'alunno.",
        documenti: []
      };

      db[currentClass].push(newStudent);
      saveStorage(db);
      currentStudentId = newStudent.id;
      renderStudentList();
      renderStudentDetail();
    }

    function addDocument() {
      const titleInput = document.getElementById('doc-title');
      const typeInput = document.getElementById('doc-type');
      const notesInput = document.getElementById('doc-notes');
      const fileInput = document.getElementById('doc-file');

      if (!titleInput.value.trim()) {
        alert("Inserisci un titolo per il documento.");
        return;
      }

      const file = fileInput.files[0];

      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          saveDocumentData(titleInput.value.trim(), typeInput.value, notesInput.value.trim(), file.name, e.target.result);
        };
        reader.readAsDataURL(file);
      } else {
        saveDocumentData(titleInput.value.trim(), typeInput.value, notesInput.value.trim(), '', '');
      }
    }

    function saveDocumentData(titolo, tipo, note, fileName, fileData) {
      const db = getStorage();
      const student = db[currentClass].find(s => s.id === currentStudentId);

      const newDoc = {
        tipo: tipo,
        titolo: titolo,
        note: note,
        data: new Date().toISOString().split('T')[0],
        fileName: fileName,
        fileData: fileData
      };

      student.documenti.unshift(newDoc);

      let autoSummaryAdd = `\n- [${newDoc.data}] ${newDoc.tipo.toUpperCase()}: ${newDoc.titolo}. ${newDoc.note}`;
      if (fileName) {
        autoSummaryAdd += ` (Allegato: ${fileName})`;
      }
      student.sommario += autoSummaryAdd;

      saveStorage(db);
      renderStudentList();
      renderStudentDetail();
    }

    function updateSummary() {
      const text = document.getElementById('summary-text').value;
      const db = getStorage();
      const student = db[currentClass].find(s => s.id === currentStudentId);
      if (student) {
        student.sommario = text;
        saveStorage(db);
      }
    }

    // Avvio
    selectClass('1A');
  </script>
</body>
</html>
